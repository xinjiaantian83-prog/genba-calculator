<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鉄筋拾い</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0e0d;
    color: #e0fff8;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 14px;
  }
  h2 {
    color: #00ffd5;
    font-size: 18px;
    margin: 0 0 12px 0;
    text-shadow: 0 0 6px #00ffd540;
    border-left: 4px solid #00ff88;
    padding-left: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .reset-btn {
    background: #2a0e0e;
    color: #ff7a7a;
    border: 1px solid #ff7a7a55;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .reset-btn:active { background: #3a1010; }

  .shape-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .shape-tab {
    background: #0c1f1d;
    color: #4ad9c2;
    border: 1px solid #008c7a;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .shape-tab:active { background: #103631; }
  .shape-tab.active {
    background: linear-gradient(160deg, #0d2926, #061613);
    color: #00ffd5;
    border-color: #00ffd5;
    box-shadow: inset 0 0 12px #00ffd520;
  }

  .size-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .size-tab {
    background: #0c1f1d;
    color: #4ad9c2;
    border: 1px solid #008c7a;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .size-tab:active { background: #103631; }
  .size-tab.active {
    background: #0a2622;
    color: #00ffd5;
    border-color: #00ffd5;
  }

  .input-row { margin-bottom: 10px; }
  .input-row label {
    display: block;
    font-size: 13px;
    color: #4ad9c2;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .input-row input {
    width: 100%;
    background: #061613;
    border: 1px solid #008c7a;
    color: #00ffd5;
    padding: 12px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    -webkit-appearance: none;
  }
  .input-row input:focus {
    outline: none;
    border-color: #00ffd5;
    box-shadow: 0 0 0 2px #00ffd530;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .rebar-fig {
    background: #0a1f1c;
    border: 1px solid #00ffd540;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    margin: 14px 0;
  }
  .rebar-fig svg {
    max-width: 100%;
    height: auto;
  }

  .result-box {
    background: #061613;
    border: 1px solid #00ff8855;
    border-radius: 12px;
    padding: 14px;
    margin-top: 14px;
    box-shadow: inset 0 0 12px #00ff8810;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px dashed #0c3d3a;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row .lbl {
    font-size: 13px;
    color: #4ad9c2;
  }
  .result-row .val {
    font-size: 22px;
    font-weight: 800;
    color: #00ff88;
    text-shadow: 0 0 8px #00ff8850;
    font-family: "SF Mono", Menlo, monospace;
  }
  .result-row.main .val {
    font-size: 26px;
    color: #ffe9a8;
  }

  .note {
    font-size: 11px;
    color: #6a8a85;
    margin-top: 10px;
    line-height: 1.6;
  }

  .header {
    text-align: center;
    padding: 8px 0 14px;
    border-bottom: 1px solid #0c3d3a;
    margin-bottom: 14px;
  }
  .header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #00ffd5;
    text-shadow: 0 0 8px #00ffd560;
  }
  .header .sub {
    margin-top: 2px;
    font-size: 11px;
    color: #4ad9c2;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>🔩 鉄筋拾い</h1>
    <div class="sub">REBAR ESTIMATOR</div>
  </div>

  <h2>
    <span>L型 / I型 鉄筋拾い</span>
    <button class="reset-btn" onclick="resetRebar()">リセット</button>
  </h2>

  <div class="shape-tabs">
    <button class="shape-tab active" id="tabL" onclick="setShape('L')">L型</button>
    <button class="shape-tab" id="tabI" onclick="setShape('I')">I型</button>
  </div>

  <div class="input-row">
    <label>鉄筋サイズ</label>
    <div class="size-tabs">
      <button class="size-tab active" id="sizeD10" onclick="setSize('D10')">D10</button>
      <button class="size-tab" id="sizeD13" onclick="setSize('D13')">D13</button>
      <button class="size-tab" id="sizeD16" onclick="setSize('D16')">D16</button>
    </div>
  </div>

  <div class="grid-2">
    <div class="input-row">
      <label>ピッチ @（mm）</label>
      <input type="number" id="rPitch" inputmode="decimal" value="200" oninput="calcRebar()">
    </div>
    <div class="input-row">
      <label>延長 L（mm）</label>
      <input type="number" id="rLength" inputmode="decimal" placeholder="例: 10000" oninput="calcRebar()">
    </div>
  </div>

  <div class="grid-2">
    <div class="input-row">
      <label>高さ H（mm）</label>
      <input type="number" id="rH" inputmode="decimal" placeholder="例: 1500" oninput="calcRebar()">
    </div>
    <div class="input-row" id="rowB">
      <label>ベース出幅 B（mm）</label>
      <input type="number" id="rB" inputmode="decimal" placeholder="例: 600" oninput="calcRebar()">
    </div>
  </div>

  <div class="grid-2">
    <div class="input-row">
      <label>被り（mm）</label>
      <input type="number" id="rCover" inputmode="decimal" value="50" oninput="calcRebar()">
    </div>
    <div class="input-row">
      <label>ロス率（%）</label>
      <input type="number" id="rLoss" inputmode="decimal" value="10" oninput="calcRebar()">
    </div>
  </div>

  <div class="input-row">
    <label>定尺（mm）</label>
    <input type="number" id="rStock" inputmode="decimal" value="4000" oninput="calcRebar()">
  </div>

  <div class="rebar-fig">
    <svg id="rebarSvg" viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="result-box">
    <div class="result-row">
      <span class="lbl">鉄筋径</span>
      <span class="val" id="rDia">—</span>
    </div>
    <div class="result-row">
      <span class="lbl">定着長（40D）</span>
      <span class="val" id="rAnchor">—</span>
    </div>
    <div class="result-row">
      <span class="lbl">1本あたり加工長</span>
      <span class="val" id="rPerLen">—</span>
    </div>
    <div class="result-row">
      <span class="lbl">必要本数</span>
      <span class="val" id="rCount">—</span>
    </div>
    <div class="result-row">
      <span class="lbl">総延長</span>
      <span class="val" id="rTotal">—</span>
    </div>
    <div class="result-row">
      <span class="lbl">ロス込み総延長</span>
      <span class="val" id="rTotalLoss">—</span>
    </div>
    <div class="result-row main">
      <span class="lbl" id="rStockLbl">4m鉄筋必要本数</span>
      <span class="val" id="rStockCount">—</span>
    </div>
  </div>

  <div class="note">
    ※ 構造計算ではなく<b style="color:#ffd266;">材料拾いの目安</b>です。<br>
    ※ 被り・定着・継手・曲げ・ロスは<b style="color:#ffd266;">設計図・現場条件を優先</b>してください。<br>
    ※ 入力値は自動保存されます。
  </div>

</div>

<script>
const STORAGE_KEY = 'rebarPick_v1';

let currentShape = 'L';
let currentSize  = 'D10';

const SIZE_DIA = { D10: 10, D13: 13, D16: 16 };

function setShape(s) {
  currentShape = s;
  document.getElementById('tabL').classList.toggle('active', s === 'L');
  document.getElementById('tabI').classList.toggle('active', s === 'I');
  document.getElementById('rowB').style.display = (s === 'I') ? 'none' : '';
  calcRebar();
}

function setSize(s) {
  currentSize = s;
  ['D10','D13','D16'].forEach(k => {
    document.getElementById('size'+k).classList.toggle('active', k === s);
  });
  calcRebar();
}

function calcRebar() {
  const dia    = SIZE_DIA[currentSize] || 10;
  const pitch  = parseFloat(document.getElementById('rPitch').value);
  const L      = parseFloat(document.getElementById('rLength').value);
  const H      = parseFloat(document.getElementById('rH').value);
  const B      = parseFloat(document.getElementById('rB').value);
  const cover  = parseFloat(document.getElementById('rCover').value);
  const loss   = parseFloat(document.getElementById('rLoss').value);
  const stock  = parseFloat(document.getElementById('rStock').value);

  const anchor = dia * 40;

  document.getElementById('rDia').textContent = currentSize + ' (φ' + dia + 'mm)';
  document.getElementById('rAnchor').textContent = anchor + ' mm (40D)';

  const stockLblEl = document.getElementById('rStockLbl');
  if (isFinite(stock) && stock > 0) {
    if (Math.round(stock) === 4000) {
      stockLblEl.textContent = '4m鉄筋必要本数';
    } else {
      stockLblEl.textContent = '定尺鉄筋必要本数（' + Math.round(stock) + 'mm）';
    }
  } else {
    stockLblEl.textContent = '定尺鉄筋必要本数';
  }

  const baseValid = isFinite(pitch) && pitch > 0
                 && isFinite(L) && L > 0
                 && isFinite(H) && H > 0
                 && isFinite(cover) && cover >= 0
                 && isFinite(loss) && loss >= 0
                 && isFinite(stock) && stock > 0;

  let perLen = NaN;
  if (currentShape === 'L') {
    if (baseValid && isFinite(B) && B > 0) {
      perLen = (H - cover) + (B - cover) + anchor;
    }
  } else {
    if (baseValid) {
      perLen = (H - cover * 2) + anchor;
    }
  }

  if (!isFinite(perLen) || perLen <= 0) {
    document.getElementById('rPerLen').textContent = '—';
    document.getElementById('rCount').textContent = '—';
    document.getElementById('rTotal').textContent = '—';
    document.getElementById('rTotalLoss').textContent = '—';
    document.getElementById('rStockCount').textContent = '—';
    drawRebarSvg(H, B, cover, anchor);
    saveAll();
    return;
  }

  const count = Math.ceil(L / pitch) + 1;
  const total = perLen * count;
  const totalLoss = total * (1 + loss / 100);
  const stockCount = Math.ceil(totalLoss / stock);

  document.getElementById('rPerLen').textContent = Math.round(perLen).toLocaleString() + ' mm';
  document.getElementById('rCount').textContent  = count.toLocaleString() + ' 本';
  document.getElementById('rTotal').textContent  = (total / 1000).toFixed(2) + ' m';
  document.getElementById('rTotalLoss').textContent = (totalLoss / 1000).toFixed(2) + ' m';
  document.getElementById('rStockCount').textContent = stockCount.toLocaleString() + ' 本';

  drawRebarSvg(H, B, cover, anchor);
  saveAll();
}

function drawRebarSvg(H, B, cover, anchor) {
  const svg = document.getElementById('rebarSvg');
  if (!svg) return;
  const VB_W = 320, VB_H = 260;

  // 配色
  const C_CONC      = '#00ffd540'; // 薄シアン（コンクリ外形）
  const C_CONC_FILL = '#0d2926';
  const C_REBAR     = '#7af5ff';   // 太い明るいシアン（鉄筋）
  const C_DIM       = '#00ff88';   // 寸法線（細い緑）
  const C_NOTE      = '#ffd266';   // 注記（黄色）
  const C_COVER     = '#cfeee8';   // 被りラベル

  let html = '';

  if (currentShape === 'L') {
    const valid = isFinite(H) && isFinite(B) && H > 0 && B > 0
               && isFinite(cover) && cover >= 0;
    if (!valid) {
      html += `<text x="${VB_W/2}" y="${VB_H/2}" fill="#4ad9c2" font-size="12" font-family="monospace" text-anchor="middle">H・B を入力してください</text>`;
      svg.innerHTML = html;
      return;
    }

    // 描画領域（外周ラベル分のマージンを確保）
    const padL = 50, padR = 70, padT = 30, padB = 50;
    const drawW = VB_W - padL - padR;
    const drawH = VB_H - padT - padB;

    // L型擁壁の外形寸法（簡略化）
    // 縦壁の幅は H の約12%、底版の厚みは B の約20%（最低限の壁厚を確保）
    const stemW = Math.max(H * 0.12, 60);
    const baseT = Math.max(B * 0.20, 60);

    // 外形全体（縦壁高さ H, 横ベース B として描画）
    // 外形の外接サイズ（mm）
    const outerW = B;
    const outerH = H;

    // スケーリング
    const sX = drawW / outerW;
    const sY = drawH / outerH;
    const s  = Math.min(sX, sY);

    // mm→px ヘルパー
    const px = (mm) => mm * s;

    // 配置基準（左下原点）
    const x0 = padL + (drawW - outerW * s) / 2; // 左
    const y0 = padT + (drawH - outerH * s) / 2 + outerH * s; // 底辺y

    // L型擁壁外形ポイント（左上から時計回り）
    // 縦壁: 左上 → 縦壁右上 → 底版上面（縦壁右下=底版上面と接続） → 底版右上 → 底版右下 → 左下 → 左上 戻り
    const x_outLeft   = x0;                          // 外形左
    const x_stemRight = x0 + px(stemW);              // 縦壁右辺（底版より上）
    const x_outRight  = x0 + px(outerW);             // 底版右
    const y_outTop    = y0 - px(outerH);             // 縦壁上端
    const y_baseTop   = y0 - px(baseT);              // 底版上面
    const y_outBot    = y0;                          // 底版下端

    const concPath =
      `M ${x_outLeft} ${y_outTop} ` +
      `L ${x_stemRight} ${y_outTop} ` +
      `L ${x_stemRight} ${y_baseTop} ` +
      `L ${x_outRight} ${y_baseTop} ` +
      `L ${x_outRight} ${y_outBot} ` +
      `L ${x_outLeft} ${y_outBot} Z`;

    html += `<path d="${concPath}" fill="${C_CONC_FILL}" stroke="${C_CONC}" stroke-width="2" stroke-linejoin="round"/>`;

    // 地面ライン
    html += `<line x1="${5}" y1="${y_outBot}" x2="${VB_W - 5}" y2="${y_outBot}" stroke="#4ad9c2" stroke-width="1" stroke-dasharray="3 3"/>`;

    // 被り（px）
    const covPx = Math.max(px(cover), 4);

    // L型鉄筋（縦筋 → 曲げ → ベース筋 → 定着）
    // 縦筋：縦壁内の中央線寄り（被り分内側）。縦壁の右側（土圧側）に配筋する想定で右寄り。
    const xRebar     = x_stemRight - covPx;          // 縦筋のx（縦壁の被り分内側）
    const yRebarTop  = y_outTop + covPx;             // 縦筋の上端
    // ベース筋：底版内、上面被り分内側、左から右へ
    const yBaseRebar = y_baseTop + covPx;            // ベース筋の高さ
    const xBaseEnd   = x_outRight - covPx;           // ベース筋の右端

    // 曲げ部の半径
    const rBend = Math.max(Math.min(px(H), px(B)) * 0.04, 4);

    // 定着長（px）— 過剰に伸びないようキャップ
    const ancPx = Math.min(px(anchor), 50);

    // 定着方向：
    // ・縦筋上端 → 内側（左）に折って定着
    // ・ベース筋右端 → 上に折って定着
    const xAnchorTopEnd = xRebar - rBend - ancPx;    // 縦筋定着端x
    const yAnchorRightEnd = yBaseRebar - rBend - ancPx; // ベース筋定着端y

    // 1本の連続線として描画：
    // 上の定着端 → 縦筋上 → 曲げ（縦→ベース） → ベース筋 → 曲げ（ベース→定着上向き） → ベース筋上の定着端
    const rebarPath =
      `M ${xAnchorTopEnd} ${yRebarTop} ` +                           // 縦筋上端の定着端（左）
      `L ${xRebar - rBend} ${yRebarTop} ` +
      `A ${rBend} ${rBend} 0 0 1 ${xRebar} ${yRebarTop + rBend} ` +  // 上端の曲げ（左→下）
      `L ${xRebar} ${yBaseRebar - rBend} ` +                          // 縦筋本体
      `A ${rBend} ${rBend} 0 0 1 ${xRebar + rBend} ${yBaseRebar} ` + // 縦→ベースの曲げ
      `L ${xBaseEnd - rBend} ${yBaseRebar} ` +                        // ベース筋本体
      `A ${rBend} ${rBend} 0 0 1 ${xBaseEnd} ${yBaseRebar - rBend} `+ // ベース右端の曲げ（右→上）
      `L ${xBaseEnd} ${yAnchorRightEnd}`;                             // ベース定着端

    html += `<path d="${rebarPath}" fill="none" stroke="${C_REBAR}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;

    // 定着長ラベル（縦筋上端側）
    html += `<text x="${xAnchorTopEnd - 4}" y="${yRebarTop - 4}" fill="${C_NOTE}"
              font-size="10" font-family="monospace" text-anchor="end">定着 ${anchor}mm</text>`;
    // 定着長ラベル（ベース筋右端側）
    html += `<text x="${xBaseEnd + 4}" y="${yAnchorRightEnd + 4}" fill="${C_NOTE}"
              font-size="10" font-family="monospace">定着 ${anchor}mm</text>`;

    // 被りライン（縦筋・縦壁右端から内側へ）
    html += `<line x1="${x_stemRight}" y1="${yRebarTop + 12}" x2="${xRebar}" y2="${yRebarTop + 12}"
              stroke="${C_COVER}" stroke-width="1"/>`;
    html += `<text x="${(x_stemRight + xRebar)/2}" y="${yRebarTop + 24}" fill="${C_COVER}"
              font-size="9" font-family="monospace" text-anchor="middle">被り${Math.round(cover)}</text>`;

    // 寸法線：H（左外側）
    html += `<line x1="${x_outLeft - 18}" y1="${y_outTop}" x2="${x_outLeft - 18}" y2="${y_outBot}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<line x1="${x_outLeft - 22}" y1="${y_outTop}" x2="${x_outLeft - 14}" y2="${y_outTop}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<line x1="${x_outLeft - 22}" y1="${y_outBot}" x2="${x_outLeft - 14}" y2="${y_outBot}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<text x="${x_outLeft - 20}" y="${(y_outTop + y_outBot)/2}" fill="${C_DIM}"
              font-size="10" font-family="monospace" text-anchor="end"
              transform="rotate(-90 ${x_outLeft - 20} ${(y_outTop + y_outBot)/2})">H=${Math.round(H)}</text>`;

    // 寸法線：B（下外側）
    html += `<line x1="${x_outLeft}" y1="${y_outBot + 18}" x2="${x_outRight}" y2="${y_outBot + 18}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<line x1="${x_outLeft}" y1="${y_outBot + 14}" x2="${x_outLeft}" y2="${y_outBot + 22}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<line x1="${x_outRight}" y1="${y_outBot + 14}" x2="${x_outRight}" y2="${y_outBot + 22}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<text x="${(x_outLeft + x_outRight)/2}" y="${y_outBot + 32}" fill="${C_DIM}"
              font-size="10" font-family="monospace" text-anchor="middle">B=${Math.round(B)}</text>`;

  } else {
    // I型
    const valid = isFinite(H) && H > 0 && isFinite(cover) && cover >= 0;
    if (!valid) {
      html += `<text x="${VB_W/2}" y="${VB_H/2}" fill="#4ad9c2" font-size="12" font-family="monospace" text-anchor="middle">H を入力してください</text>`;
      svg.innerHTML = html;
      return;
    }

    const padL = 60, padR = 60, padT = 30, padB = 30;
    const drawW = VB_W - padL - padR;
    const drawH = VB_H - padT - padB;

    // I型外形：縦長の四角（幅は適度に）
    // 幅は H の25%程度を仮定、最低120mm相当
    const wallW = Math.max(H * 0.20, 120);
    const sX = drawW / wallW;
    const sY = drawH / H;
    const s  = Math.min(sX, sY);
    const px = (mm) => mm * s;

    const wPx = px(wallW);
    const hPx = px(H);
    const x0 = padL + (drawW - wPx) / 2;
    const y0 = padT + (drawH - hPx) / 2 + hPx;
    const x1 = x0 + wPx;
    const yTop = y0 - hPx;

    // 外形（コンクリ）
    html += `<rect x="${x0}" y="${yTop}" width="${wPx}" height="${hPx}"
              fill="${C_CONC_FILL}" stroke="${C_CONC}" stroke-width="2"/>`;

    // 被り
    const covPx = Math.max(px(cover), 4);
    const xRebar = (x0 + x1) / 2;            // 鉄筋（中央配置）
    const yRebarTop = yTop + covPx;
    const yRebarBot = y0 - covPx;

    if (yRebarBot > yRebarTop) {
      // 定着長（縦長から左右に折り返し）
      const ancPx = Math.min(px(anchor), Math.max(wPx * 0.35, 30));

      // 鉄筋本体（縦線）
      html += `<line x1="${xRebar}" y1="${yRebarTop}" x2="${xRebar}" y2="${yRebarBot}"
                stroke="${C_REBAR}" stroke-width="3" stroke-linecap="round"/>`;
      // 上端のフック（右へ）
      html += `<line x1="${xRebar}" y1="${yRebarTop}" x2="${xRebar + ancPx}" y2="${yRebarTop}"
                stroke="${C_REBAR}" stroke-width="3" stroke-linecap="round"/>`;
      // 下端のフック（左へ）
      html += `<line x1="${xRebar}" y1="${yRebarBot}" x2="${xRebar - ancPx}" y2="${yRebarBot}"
                stroke="${C_REBAR}" stroke-width="3" stroke-linecap="round"/>`;

      // 定着ラベル
      html += `<text x="${xRebar + ancPx + 4}" y="${yRebarTop + 4}" fill="${C_NOTE}"
                font-size="10" font-family="monospace">定着 ${anchor}mm</text>`;
      html += `<text x="${xRebar - ancPx - 4}" y="${yRebarBot + 4}" fill="${C_NOTE}"
                font-size="10" font-family="monospace" text-anchor="end">定着 ${anchor}mm</text>`;
    }

    // 上下被りの矢印
    html += `<line x1="${x0 + 6}" y1="${yTop}" x2="${x0 + 6}" y2="${yTop + covPx}"
              stroke="${C_COVER}" stroke-width="1"/>`;
    html += `<text x="${x0 + 10}" y="${yTop + covPx/2 + 3}" fill="${C_COVER}"
              font-size="9" font-family="monospace">被り${Math.round(cover)}</text>`;

    html += `<line x1="${x0 + 6}" y1="${y0 - covPx}" x2="${x0 + 6}" y2="${y0}"
              stroke="${C_COVER}" stroke-width="1"/>`;
    html += `<text x="${x0 + 10}" y="${y0 - covPx/2 + 3}" fill="${C_COVER}"
              font-size="9" font-family="monospace">被り${Math.round(cover)}</text>`;

    // 左右被り
    html += `<line x1="${x0}" y1="${yTop + 12}" x2="${x0 + covPx}" y2="${yTop + 12}"
              stroke="${C_COVER}" stroke-width="1"/>`;
    html += `<line x1="${x1 - covPx}" y1="${yTop + 12}" x2="${x1}" y2="${yTop + 12}"
              stroke="${C_COVER}" stroke-width="1"/>`;

    // 寸法線：H（右側）
    html += `<line x1="${x1 + 18}" y1="${yTop}" x2="${x1 + 18}" y2="${y0}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<line x1="${x1 + 14}" y1="${yTop}" x2="${x1 + 22}" y2="${yTop}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<line x1="${x1 + 14}" y1="${y0}" x2="${x1 + 22}" y2="${y0}" stroke="${C_DIM}" stroke-width="1"/>`;
    html += `<text x="${x1 + 20}" y="${(yTop + y0)/2}" fill="${C_DIM}"
              font-size="10" font-family="monospace"
              transform="rotate(-90 ${x1 + 20} ${(yTop + y0)/2})" text-anchor="middle">H=${Math.round(H)}</text>`;
  }

  svg.innerHTML = html;
}

function saveAll() {
  try {
    const data = {
      shape: currentShape,
      size:  currentSize,
      rPitch:  document.getElementById('rPitch').value,
      rLength: document.getElementById('rLength').value,
      rH:      document.getElementById('rH').value,
      rB:      document.getElementById('rB').value,
      rCover:  document.getElementById('rCover').value,
      rLoss:   document.getElementById('rLoss').value,
      rStock:  document.getElementById('rStock').value
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
}

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function bootRestore() {
  const data = loadAll();
  if (data) {
    if (data.shape) currentShape = data.shape;
    if (data.size)  currentSize  = data.size;
    ['rPitch','rLength','rH','rB','rCover','rLoss','rStock'].forEach(id => {
      const el = document.getElementById(id);
      if (el && data[id] !== undefined && data[id] !== null && data[id] !== '') {
        el.value = data[id];
      }
    });
  }
  document.getElementById('tabL').classList.toggle('active', currentShape === 'L');
  document.getElementById('tabI').classList.toggle('active', currentShape === 'I');
  document.getElementById('rowB').style.display = (currentShape === 'I') ? 'none' : '';
  ['D10','D13','D16'].forEach(k => {
    document.getElementById('size'+k).classList.toggle('active', k === currentSize);
  });
  calcRebar();
}

function resetRebar() {
  if (!confirm('リセットしますか？')) return;
  currentShape = 'L';
  currentSize  = 'D10';
  document.getElementById('rPitch').value  = '200';
  document.getElementById('rLength').value = '';
  document.getElementById('rH').value      = '';
  document.getElementById('rB').value      = '';
  document.getElementById('rCover').value  = '50';
  document.getElementById('rLoss').value   = '10';
  document.getElementById('rStock').value  = '4000';

  document.getElementById('tabL').classList.add('active');
  document.getElementById('tabI').classList.remove('active');
  document.getElementById('rowB').style.display = '';
  ['D10','D13','D16'].forEach(k => {
    document.getElementById('size'+k).classList.toggle('active', k === 'D10');
  });

  try {
    const data = {
      shape: 'L', size: 'D10',
      rPitch: '200', rLength: '', rH: '', rB: '',
      rCover: '50', rLoss: '10', rStock: '4000'
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}

  calcRebar();
  alert('reset ok');
}

bootRestore();
</script>
