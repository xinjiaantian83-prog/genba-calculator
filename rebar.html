<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鉄筋数量計算</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #f4f6f5;
    color: #1a1f1d;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  body {
    min-height: 100vh;
    padding: 16px;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 4px 0 16px;
    color: #1a1f1d;
    letter-spacing: 1px;
  }
  h1 .sub {
    font-size: 11px;
    font-weight: 500;
    color: #777;
    margin-left: 8px;
  }

  /* タブ */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab {
    background: #fff;
    color: #555;
    border: 1px solid #d6dcd9;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .tab:active { background: #ecefee; }
  .tab.active {
    background: #1a8c7a;
    color: #fff;
    border-color: #1a8c7a;
  }

  /* 鉄筋径セレクタ */
  .dia-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .dia-btn {
    background: #fff;
    color: #555;
    border: 1px solid #d6dcd9;
    padding: 10px 4px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .dia-btn:active { background: #ecefee; }
  .dia-btn.active {
    background: #e6f4f1;
    color: #1a8c7a;
    border-color: #1a8c7a;
  }

  /* 入力 */
  .group {
    background: #fff;
    border: 1px solid #e3e7e6;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .group-title {
    font-size: 12px;
    color: #888;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .input-row { margin-bottom: 12px; }
  .input-row:last-child { margin-bottom: 0; }
  .input-row label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .input-row input[type="number"] {
    width: 100%;
    background: #fafbfa;
    border: 1px solid #d6dcd9;
    color: #1a1f1d;
    padding: 12px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 700;
    -webkit-appearance: none;
  }
  .input-row input[type="number"]:focus {
    outline: none;
    border-color: #1a8c7a;
    box-shadow: 0 0 0 2px #1a8c7a30;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* 折りたたみ */
  details {
    background: #fff;
    border: 1px solid #e3e7e6;
    border-radius: 12px;
    padding: 0;
    margin-bottom: 14px;
    overflow: hidden;
  }
  details > summary {
    list-style: none;
    cursor: pointer;
    padding: 14px;
    font-size: 13px;
    font-weight: 700;
    color: #555;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after {
    content: '▼';
    font-size: 10px;
    color: #999;
    transition: transform .2s;
  }
  details[open] > summary::after { transform: rotate(180deg); }
  details > .body {
    padding: 0 14px 14px;
  }

  /* トグル */
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
  }
  .toggle-row .label {
    font-size: 14px;
    color: #333;
    font-weight: 600;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 26px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ccc;
    border-radius: 999px;
    transition: .2s;
  }
  .slider:before {
    position: absolute; content: "";
    height: 20px; width: 20px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: .2s;
  }
  .switch input:checked + .slider { background: #1a8c7a; }
  .switch input:checked + .slider:before { transform: translateX(20px); }

  .sub-input {
    margin-top: 8px;
    margin-left: 0;
  }
  .sub-input.hidden { display: none; }

  /* 図 */
  .fig {
    background: #fff;
    border: 1px solid #e3e7e6;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    margin-bottom: 14px;
  }
  .fig svg {
    max-width: 100%;
    height: auto;
  }

  /* 結果 */
  .result {
    background: #fff;
    border: 1px solid #e3e7e6;
    border-radius: 12px;
    padding: 4px 14px;
    margin-bottom: 14px;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px solid #eef2f0;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row .lbl {
    font-size: 13px;
    color: #777;
    font-weight: 600;
  }
  .result-row .val {
    font-size: 22px;
    font-weight: 800;
    color: #1a1f1d;
    font-family: "SF Mono", Menlo, monospace;
  }
  .result-row.main .val {
    font-size: 28px;
    color: #1a8c7a;
  }

  /* 定着チェック */
  .anchor-check {
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .anchor-check.ok {
    background: #e6f4f1;
    color: #1a8c7a;
    border: 1px solid #1a8c7a55;
  }
  .anchor-check.ng {
    background: #fdecec;
    color: #c1372e;
    border: 1px solid #c1372e55;
  }
  .anchor-check.none {
    background: #f0f3f2;
    color: #888;
    border: 1px solid #d6dcd9;
  }
  .anchor-check .small {
    font-size: 11px;
    font-weight: 500;
    margin-top: 2px;
    opacity: 0.85;
  }

  .note {
    font-size: 11px;
    color: #888;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="app">

  <h1>鉄筋数量計算<span class="sub">材料拾い目安</span></h1>

  <!-- モードタブ -->
  <div class="tabs">
    <button class="tab active" id="tabStraight" onclick="setMode('S')">直線筋</button>
    <button class="tab" id="tabL" onclick="setMode('L')">L型筋</button>
  </div>

  <!-- 鉄筋径 -->
  <div class="group">
    <div class="group-title">鉄筋径</div>
    <div class="dia-row">
      <button class="dia-btn active" data-dia="D10" onclick="setDia('D10')">D10</button>
      <button class="dia-btn" data-dia="D13" onclick="setDia('D13')">D13</button>
      <button class="dia-btn" data-dia="D16" onclick="setDia('D16')">D16</button>
      <button class="dia-btn" data-dia="D19" onclick="setDia('D19')">D19</button>
    </div>
    <div class="result-row" style="padding:6px 0; border:none;">
      <span class="lbl">定着長（40d）</span>
      <span class="val" id="rAnchor" style="font-size:18px; color:#1a8c7a;">—</span>
    </div>
  </div>

  <!-- 直線筋 入力 -->
  <div id="paneStraight">
    <div class="group">
      <div class="group-title">直線筋 入力</div>
      <div class="input-row">
        <label>対象長さ L（mm）</label>
        <input type="number" id="sL" inputmode="decimal" placeholder="例: 5000">
      </div>
      <div class="grid-2">
        <div class="input-row">
          <label>ピッチ（mm）</label>
          <input type="number" id="sPitch" inputmode="decimal" value="200">
        </div>
        <div class="input-row">
          <label>かぶり（mm）</label>
          <input type="number" id="sCover" inputmode="decimal" value="40">
        </div>
      </div>
    </div>
  </div>

  <!-- L型筋 入力 -->
  <div id="paneL" style="display:none;">
    <div class="group">
      <div class="group-title">L型筋 入力</div>
      <div class="grid-2">
        <div class="input-row">
          <label>高さ H（mm）</label>
          <input type="number" id="lH" inputmode="decimal" placeholder="例: 1500">
        </div>
        <div class="input-row">
          <label>底幅 B（mm）</label>
          <input type="number" id="lB" inputmode="decimal" placeholder="例: 600">
        </div>
      </div>
      <div class="grid-2">
        <div class="input-row">
          <label>ピッチ（mm）</label>
          <input type="number" id="lPitch" inputmode="decimal" value="200">
        </div>
        <div class="input-row">
          <label>かぶり（mm）</label>
          <input type="number" id="lCover" inputmode="decimal" value="40">
        </div>
      </div>
    </div>

    <details>
      <summary>折り返し設定</summary>
      <div class="body">
        <div class="toggle-row">
          <span class="label">上部折り返し</span>
          <label class="switch"><input type="checkbox" id="lTop"><span class="slider"></span></label>
        </div>
        <div class="sub-input hidden" id="lTopWrap">
          <div class="input-row">
            <label>上部折り返し長（mm）</label>
            <input type="number" id="lTopLen" inputmode="decimal" placeholder="自動：10d">
          </div>
        </div>

        <div class="toggle-row">
          <span class="label">下部折り返し</span>
          <label class="switch"><input type="checkbox" id="lBot"><span class="slider"></span></label>
        </div>
        <div class="sub-input hidden" id="lBotWrap">
          <div class="input-row">
            <label>下部折り返し長（mm）</label>
            <input type="number" id="lBotLen" inputmode="decimal" placeholder="自動：10d">
          </div>
        </div>
      </div>
    </details>
  </div>

  <!-- 図（L型のみ表示） -->
  <div class="fig" id="figWrap">
    <svg id="fig" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- 定着チェック -->
  <div class="anchor-check none" id="anchorCheck">
    <div>
      <div>定着チェック</div>
      <div class="small" id="anchorCheckSmall">入力待ち</div>
    </div>
    <div id="anchorCheckIcon">—</div>
  </div>

  <!-- 結果 -->
  <div class="result">
    <div class="result-row">
      <span class="lbl">本数</span>
      <span class="val" id="rCount">—</span>
    </div>
    <div class="result-row">
      <span class="lbl">1本切寸</span>
      <span class="val" id="rPerLen">—</span>
    </div>
    <div class="result-row">
      <span class="lbl">総延長</span>
      <span class="val" id="rTotal">—</span>
    </div>
    <div class="result-row main">
      <span class="lbl">総重量</span>
      <span class="val" id="rWeight">—</span>
    </div>
  </div>

  <div class="note">
    ※ 構造計算ではなく材料拾いの目安です。<br>
    ※ かぶり・定着・継手・ロスは設計図・現場条件を優先してください。
  </div>

</div>

<script>
// 鉄筋径ごとの定数
const DIA_TABLE = {
  D10: { d: 10, bendLoss: 50, unit: 0.560 },
  D13: { d: 13, bendLoss: 60, unit: 0.995 },
  D16: { d: 16, bendLoss: 70, unit: 1.56 },
  D19: { d: 19, bendLoss: 80, unit: 2.25 }
};

let currentMode = 'S'; // 'S' | 'L'
let currentDia  = 'D10';

function $(id) { return document.getElementById(id); }

function setMode(m) {
  currentMode = m;
  $('tabStraight').classList.toggle('active', m === 'S');
  $('tabL').classList.toggle('active', m === 'L');
  $('paneStraight').style.display = (m === 'S') ? '' : 'none';
  $('paneL').style.display = (m === 'L') ? '' : 'none';
  $('figWrap').style.display = (m === 'L') ? '' : 'none';
  calc();
}

function setDia(d) {
  currentDia = d;
  document.querySelectorAll('.dia-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.dia === d);
  });
  calc();
}

function num(id) {
  const v = parseFloat($(id).value);
  return isFinite(v) ? v : NaN;
}

function clearResults() {
  $('rCount').textContent = '—';
  $('rPerLen').textContent = '—';
  $('rTotal').textContent = '—';
  $('rWeight').textContent = '—';
  setAnchor('none', '入力待ち', '—');
}

function setAnchor(state, msg, icon) {
  const el = $('anchorCheck');
  el.classList.remove('ok','ng','none');
  el.classList.add(state);
  $('anchorCheckSmall').textContent = msg;
  $('anchorCheckIcon').textContent = icon;
}

function calc() {
  const dia = DIA_TABLE[currentDia];
  const anchor = dia.d * 40;
  $('rAnchor').textContent = anchor + ' mm';

  if (currentMode === 'S') {
    calcStraight(dia, anchor);
  } else {
    calcL(dia, anchor);
  }
  drawFig();
  saveAll();
}

function calcStraight(dia, anchor) {
  const L     = num('sL');
  const pitch = num('sPitch');
  const cover = num('sCover');

  if (!isFinite(L) || L <= 0 || !isFinite(pitch) || pitch <= 0 || !isFinite(cover) || cover < 0) {
    clearResults();
    return;
  }

  const eff = L - cover * 2;
  if (eff <= 0) {
    clearResults();
    setAnchor('ng', 'かぶりが大きすぎます', 'NG');
    return;
  }

  const count = Math.floor(eff / pitch) + 1;
  const perLen = L + anchor + anchor; // 左右定着
  const total = perLen * count;
  const weight = (total / 1000) * dia.unit;

  $('rCount').textContent = count.toLocaleString() + ' 本';
  $('rPerLen').textContent = Math.round(perLen).toLocaleString() + ' mm';
  $('rTotal').textContent = (total / 1000).toFixed(2) + ' m';
  $('rWeight').textContent = weight.toFixed(2) + ' kg';

  // 直線筋では定着チェックの基準が違うので簡易的に「定着OK」表示はせず、参考表示
  setAnchor('none', '定着長は両端 ' + anchor + 'mm（40d）として計算', 'i');
}

function calcL(dia, anchor) {
  const H     = num('lH');
  const B     = num('lB');
  const pitch = num('lPitch');
  const cover = num('lCover');

  const topOn = $('lTop').checked;
  const botOn = $('lBot').checked;

  // 折り返し長：未入力なら 10d
  const tenD = dia.d * 10;
  let topLen = num('lTopLen');
  let botLen = num('lBotLen');
  if (!isFinite(topLen) || topLen <= 0) topLen = tenD;
  if (!isFinite(botLen) || botLen <= 0) botLen = tenD;

  if (!isFinite(H) || H <= 0 || !isFinite(B) || B <= 0
      || !isFinite(pitch) || pitch <= 0 || !isFinite(cover) || cover < 0) {
    clearResults();
    return;
  }

  const eff = H - cover * 2;
  if (eff <= 0) {
    clearResults();
    setAnchor('ng', 'かぶりが大きすぎます', 'NG');
    return;
  }

  const count = Math.floor(eff / pitch) + 1;

  // 1本切寸 = H + B + 定着 + 曲げロス
  let perLen = H + B + anchor + dia.bendLoss;
  if (topOn) perLen += topLen;
  if (botOn) perLen += botLen;

  const total = perLen * count;
  const weight = (total / 1000) * dia.unit;

  $('rCount').textContent = count.toLocaleString() + ' 本';
  $('rPerLen').textContent = Math.round(perLen).toLocaleString() + ' mm';
  $('rTotal').textContent = (total / 1000).toFixed(2) + ' m';
  $('rWeight').textContent = weight.toFixed(2) + ' kg';

  // 定着チェック（ベース側）
  const baseEff = B - cover * 2;
  if (baseEff >= anchor) {
    setAnchor('ok', '有効長 ' + Math.round(baseEff) + 'mm ≧ 定着 ' + anchor + 'mm', 'OK');
  } else {
    setAnchor('ng',
      '有効長 ' + Math.round(baseEff) + 'mm < 定着 ' + anchor + 'mm（フック等を検討）',
      '不足');
  }
}

// L型図
function drawFig() {
  const svg = $('fig');
  const VB_W = 320, VB_H = 220;
  if (currentMode !== 'L') {
    svg.innerHTML = '';
    return;
  }

  const H = num('lH');
  const B = num('lB');
  const cover = num('lCover');
  const dia = DIA_TABLE[currentDia];
  const anchor = dia.d * 40;

  let html = '';
  if (!isFinite(H) || H <= 0 || !isFinite(B) || B <= 0) {
    html += `<text x="${VB_W/2}" y="${VB_H/2}" fill="#999" font-size="12" font-family="sans-serif" text-anchor="middle">H・B を入力してください</text>`;
    svg.innerHTML = html;
    return;
  }

  const padL = 50, padR = 70, padT = 25, padB = 45;
  const drawW = VB_W - padL - padR;
  const drawH = VB_H - padT - padB;

  const sX = drawW / B;
  const sY = drawH / H;
  const s  = Math.min(sX, sY);

  const wB = B * s;
  const wH = H * s;
  const x0 = padL + (drawW - wB) / 2;
  const y0 = padT + (drawH - wH) / 2 + wH;
  const xR = x0 + wB;
  const yT = y0 - wH;

  // L型筋本体（縦→曲げ→横）。フックは描かない指示なので両端は直線で終了。
  const r = Math.max(Math.min(wH, wB) * 0.06, 6);
  const ancPxV = Math.min(anchor * s, wB * 0.4); // 上端定着の見た目（左へ折る代わりに上で停止表現）
  const ancPxH = Math.min(anchor * s, wH * 0.3);

  // 縦筋（左寄り、被り分内側）
  const covPx = Math.max(cover * s, 4);
  const xV = x0 + covPx;
  const yV_top = yT + 6; // 上端（少し内側）
  const yBase  = y0 - covPx;
  const xH_end = xR - 6;

  const path =
    `M ${xV} ${yV_top} ` +
    `L ${xV} ${yBase - r} ` +
    `A ${r} ${r} 0 0 0 ${xV + r} ${yBase} ` +
    `L ${xH_end} ${yBase}`;

  html += `<path d="${path}" fill="none" stroke="#1a8c7a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;

  // L型コンクリ外形（補助：薄い線）
  const stemW = Math.max(wB * 0.20, 18);
  const baseT = Math.max(wH * 0.18, 18);
  const concPath =
    `M ${x0} ${yT} L ${x0 + stemW} ${yT} L ${x0 + stemW} ${y0 - baseT} L ${xR} ${y0 - baseT} L ${xR} ${y0} L ${x0} ${y0} Z`;
  html = `<path d="${concPath}" fill="#f4f6f5" stroke="#d6dcd9" stroke-width="1.5" stroke-linejoin="round"/>` + html;

  // 寸法線：H（左外）
  html += `<line x1="${x0 - 18}" y1="${yT}" x2="${x0 - 18}" y2="${y0}" stroke="#888" stroke-width="1"/>`;
  html += `<line x1="${x0 - 22}" y1="${yT}" x2="${x0 - 14}" y2="${yT}" stroke="#888" stroke-width="1"/>`;
  html += `<line x1="${x0 - 22}" y1="${y0}" x2="${x0 - 14}" y2="${y0}" stroke="#888" stroke-width="1"/>`;
  html += `<text x="${x0 - 20}" y="${(yT + y0)/2}" fill="#555" font-size="11" font-family="monospace" text-anchor="middle" transform="rotate(-90 ${x0 - 20} ${(yT + y0)/2})">H=${Math.round(H)}</text>`;

  // 寸法線：B（下外）
  html += `<line x1="${x0}" y1="${y0 + 18}" x2="${xR}" y2="${y0 + 18}" stroke="#888" stroke-width="1"/>`;
  html += `<line x1="${x0}" y1="${y0 + 14}" x2="${x0}" y2="${y0 + 22}" stroke="#888" stroke-width="1"/>`;
  html += `<line x1="${xR}" y1="${y0 + 14}" x2="${xR}" y2="${y0 + 22}" stroke="#888" stroke-width="1"/>`;
  html += `<text x="${(x0 + xR)/2}" y="${y0 + 32}" fill="#555" font-size="11" font-family="monospace" text-anchor="middle">B=${Math.round(B)}</text>`;

  // 定着長ラベル（ベース側）
  html += `<text x="${xH_end}" y="${yBase - 6}" fill="#c97a16" font-size="11" font-family="monospace" text-anchor="end" font-weight="bold">定着 ${anchor}mm</text>`;

  svg.innerHTML = html;
}

/* 折り返しトグルの表示制御 */
function bindToggles() {
  $('lTop').addEventListener('change', () => {
    $('lTopWrap').classList.toggle('hidden', !$('lTop').checked);
    calc();
  });
  $('lBot').addEventListener('change', () => {
    $('lBotWrap').classList.toggle('hidden', !$('lBot').checked);
    calc();
  });
}

/* 入力イベントを一括バインド */
function bindInputs() {
  ['sL','sPitch','sCover',
   'lH','lB','lPitch','lCover','lTopLen','lBotLen']
   .forEach(id => $(id).addEventListener('input', calc));
}

/* localStorage 保存・復元 */
const KEY = 'rebarSimple_v1';
function saveAll() {
  try {
    const data = {
      mode: currentMode,
      dia:  currentDia,
      sL: $('sL').value, sPitch: $('sPitch').value, sCover: $('sCover').value,
      lH: $('lH').value, lB: $('lB').value, lPitch: $('lPitch').value, lCover: $('lCover').value,
      lTop: $('lTop').checked, lTopLen: $('lTopLen').value,
      lBot: $('lBot').checked, lBotLen: $('lBotLen').value
    };
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (e) {}
}
function loadAll() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.mode) currentMode = d.mode;
    if (d.dia)  currentDia  = d.dia;
    ['sL','sPitch','sCover','lH','lB','lPitch','lCover','lTopLen','lBotLen'].forEach(id => {
      if (d[id] !== undefined && d[id] !== null && d[id] !== '') $(id).value = d[id];
    });
    if (d.lTop) { $('lTop').checked = true; $('lTopWrap').classList.remove('hidden'); }
    if (d.lBot) { $('lBot').checked = true; $('lBotWrap').classList.remove('hidden'); }
  } catch (e) {}
}

/* 起動 */
loadAll();
bindToggles();
bindInputs();
setMode(currentMode);
setDia(currentDia);
</script>
</body>
</html>
