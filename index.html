<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>現場電卓</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #081018;
    color: #eaffff;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    background: #0d1722;
    border: 1px solid #00e5ff55;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 0 30px #00e5ff22;
  }
  h1 {
    margin: 0 0 6px;
    color: #00e5ff;
    font-size: 26px;
  }
  .sub {
    color: #88a;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  button {
    border: 0;
    border-radius: 10px;
    padding: 12px;
    background: #132437;
    color: #dfffff;
    font-size: 16px;
  }
  .tab.active, .calc button.op {
    background: #00e5ff;
    color: #001014;
    font-weight: bold;
  }
  .panel {
    display: none;
  }
  .panel.active {
    display: block;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 8px 0 14px;
    border-radius: 10px;
    border: 1px solid #00e5ff55;
    background: #07111c;
    color: #fff;
    font-size: 22px;
  }
  .result {
    margin-top: 12px;
    padding: 18px;
    border-radius: 14px;
    background: #06131d;
    border: 1px solid #00ff9f66;
    text-align: center;
  }
  .result .label {
    color: #9ab;
    font-size: 14px;
  }
  .result .value {
    color: #00ff9f;
    font-size: 42px;
    font-weight: bold;
  }
  .display {
    background: #050b12;
    border: 1px solid #00e5ff44;
    border-radius: 12px;
    padding: 16px;
    text-align: right;
    font-size: 34px;
    margin-bottom: 12px;
    min-height: 44px;
    overflow-x: auto;
  }
  .calc {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .calc button {
    font-size: 20px;
  }
  .wide {
    grid-column: span 2;
  }
  footer {
    margin-top: 18px;
    text-align: center;
    color: #6f8795;
    font-size: 12px;
  }
  footer a {
    color: #00e5ff;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>現場電卓</h1>
    <div class="sub">普通計算 ＋ 斜距離計算</div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('normal', this)">普通電卓</button>
      <button class="tab" onclick="showTab('slope', this)">斜距離</button>
    </div>

    <section id="normal" class="panel active">
      <div id="display" class="display">0</div>
      <div class="calc">
        <button onclick="clearCalc()">C</button>
        <button onclick="delChar()">⌫</button>
        <button onclick="press('/')">÷</button>
        <button onclick="press('*')" class="op">×</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('-')" class="op">−</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('+')" class="op">＋</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="calcResult()" class="op">＝</button>

        <button onclick="press('0')" class="wide">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="press('00')">00</button>
      </div>
    </section>

    <section id="slope" class="panel">
      <label>横寸法 mm</label>
      <input id="x" type="number" inputmode="decimal" placeholder="例：3000" oninput="calcSlope()" />

      <label>縦寸法 mm</label>
      <input id="y" type="number" inputmode="decimal" placeholder="例：600" oninput="calcSlope()" />

      <div class="result">
        <div class="label">斜距離</div>
        <div id="slopeResult" class="value">0 mm</div>
      </div>
    </section>

    <footer style="margin-top:16px; text-align:center;">

  <a href="https://wanwancoin.jp" target="_blank"
     style="
       display:inline-block;
       padding:12px 18px;
       border-radius:12px;
       background:#00e5ff;
       color:#001014;
       font-weight:bold;
       text-decoration:none;
       box-shadow:0 0 12px #00e5ff66;
     ">
    🐶 ワンコイン自販機を探す
  </a>

  <div style="margin-top:8px; font-size:12px; color:#6f8795;">
    powered by わんわんコイン
  </div>

</footer>
  </div>

<script>
let expr = "";

function showTab(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}

function updateDisplay() {
  document.getElementById("display").textContent = expr || "0";
}

function press(v) {
  expr += v;
  updateDisplay();
}

function clearCalc() {
  expr = "";
  updateDisplay();
}

function delChar() {
  expr = expr.slice(0, -1);
  updateDisplay();
}

function calcResult() {
  try {
    if (!expr) return;
    const result = Function('"use strict"; return (' + expr + ')')();
    expr = String(Math.round(result * 100000) / 100000);
    updateDisplay();
  } catch {
    document.getElementById("display").textContent = "Error";
    expr = "";
  }
}

function calcSlope() {
  const x = parseFloat(document.getElementById("x").value) || 0;
  const y = parseFloat(document.getElementById("y").value) || 0;
  const d = Math.sqrt(x * x + y * y);
  document.getElementById("slopeResult").textContent = Math.round(d) + " mm";
}
</script>
</body>
</html>
