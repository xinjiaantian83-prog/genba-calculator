<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>現場電卓</title>
<style>
 body {
  margin: 0;
  font-family: system-ui, sans-serif;
  color: #eaffff;
  display: flex;
  justify-content: center;
  padding: 20px;

  background:
    linear-gradient(#081018, #081018),
    repeating-linear-gradient(
      0deg,
      #00e5ff11 0px,
      #00e5ff11 1px,
      transparent 1px,
      transparent 40px
    ),
    repeating-linear-gradient(
      90deg,
      #00e5ff11 0px,
      #00e5ff11 1px,
      transparent 1px,
      transparent 40px
    );
}
  h1 {
    margin: 0 0 6px;
    color: #00e5ff;
    font-size: 26px;
  }
  .sub {
    color: #88a;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
 button {
  border: 0;
  border-radius: 10px;
  padding: 12px;
  background: #132437;
  color: #dfffff;
  font-size: 16px;
}

button:active {
  transform: scale(0.96);
  box-shadow: 0 0 10px #00e5ff;
}
    
  .tab.active {
  background: #00e5ff;
  color: #001014;
  font-weight: bold;
  box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff44;
}
  .panel {
    display: none;
  }
  .panel.active {
    display: block;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 8px 0 14px;
    border-radius: 10px;
    border: 1px solid #00e5ff55;
    background: #07111c;
    color: #fff;
    font-size: 22px;
  }
  .result {
    margin-top: 12px;
    padding: 18px;
    border-radius: 14px;
    background: #06131d;
    border: 1px solid #00ff9f66;
    text-align: center;
  }
  .result .label {
    color: #9ab;
    font-size: 14px;
  }
  .value {
  font-size: 52px;
  font-weight: bold;
  color: #00ff9f;
  text-shadow: 0 0 8px #00ff9f, 0 0 20px #00ff9f44;
}
  .display {
    background: #050b12;
    border: 1px solid #00e5ff44;
    border-radius: 12px;
    padding: 16px;
    text-align: right;
    font-size: 34px;
    margin-bottom: 12px;
    min-height: 44px;
    overflow-x: auto;
  }
  .calc {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .calc button {
    font-size: 20px;
  }
  .wide {
    grid-column: span 2;
  }
  footer {
    margin-top: 18px;
    text-align: center;
    color: #6f8795;
    font-size: 12px;
  }
  footer a {
    color: #00e5ff;
    text-decoration: none;
  }
 .home {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}

.home button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  text-align: left;
  border: 1px solid #00e5ff44;
}
</style>
</head>
<body>
  <div class="app">
    <h1>現場電卓</h1>
   <div class="sub">現場で使う計算をまとめた職人向けツール</div>

<div id="home" class="home active">
  <button onclick="showTab('normal', this)">普通電卓</button>
  <button onclick="showTab('slope', this)">勾配・斜距離</button>
  <button onclick="showComingSoon('土間コン')">土間コン</button>
  <button onclick="showComingSoon('重力式擁壁')">重力式擁壁</button>
  <button onclick="showComingSoon('ブロックサポート')">ブロックサポート</button>
  <button onclick="showComingSoon('比重表')">比重表</button>
</div>

    <section id="normal" class="panel">
     <button class="back" onclick="showHome()">← メニューに戻る</button>
      <div id="display" class="display">0</div>
      <div class="calc">
        <button onclick="clearCalc()">C</button>
        <button onclick="delChar()">⌫</button>
        <button onclick="press('/')">÷</button>
        <button onclick="press('*')" class="op">×</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('-')" class="op">−</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('+')" class="op">＋</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="calcResult()" class="op">＝</button>

        <button onclick="press('0')" class="wide">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="press('00')">00</button>
      </div>
    </section>

    <section id="slope" class="panel">
     <button class="back" onclick="showHome()">← メニューに戻る</button>
      <label>横寸法 mm</label>
      <input id="x" type="number" inputmode="decimal" placeholder="例：3000" oninput="calcSlope()" />

      <label>縦寸法 mm</label>
      <input id="y" type="number" inputmode="decimal" placeholder="例：600" oninput="calcSlope()" />

      <div class="result">
        <div class="label">斜距離</div>
        <div id="slopeResult" class="value">0 mm</div>
      </div>
      <div class="result">
  <div class="label">角度</div>
  <div id="angleResult" class="value">0°</div>
</div>
    </section>

    <footer style="margin-top:16px; text-align:center;">

  <a href="https://wanwancoin.jp" target="_blank"
     style="
       display:inline-block;
       padding:12px 18px;
       border-radius:12px;
       background:#00e5ff;
       color:#001014;
       font-weight:bold;
       text-decoration:none;
       box-shadow:0 0 12px #00e5ff66;
     ">
    🐶 ワンコイン自販機を探す
  </a>

  <div style="margin-top:8px; font-size:12px; color:#6f8795;">
    powered by わんわんコイン
  </div>

</footer>
  </div>

<script>
let expr = "";

function showTab(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}

function updateDisplay() {
  document.getElementById("display").textContent = expr || "0";
}

function press(v) {
  expr += v;
  updateDisplay();
}

function clearCalc() {
  expr = "";
  updateDisplay();
}

function delChar() {
  expr = expr.slice(0, -1);
  updateDisplay();
}

function calcResult() {
  try {
    if (!expr) return;
    const result = Function('"use strict"; return (' + expr + ')')();
    expr = String(Math.round(result * 100000) / 100000);
    updateDisplay();
  } catch {
    document.getElementById("display").textContent = "Error";
    expr = "";
  }
}
function calcSlope() {
  const x = parseFloat(document.getElementById("x").value) || 0;
  const y = parseFloat(document.getElementById("y").value) || 0;

  const d = Math.sqrt(x * x + y * y);
  const resultVal = Math.round(d);

  const slopeEl = document.getElementById("slopeResult");

  slopeEl.textContent = resultVal + " mm";

  const angle = Math.atan2(y, x) * (180 / Math.PI);
  document.getElementById("angleResult").textContent =
    angle.toFixed(1) + "°";

  // 🔥 通常演出（ドン）
  slopeEl.style.transform = "scale(1.1)";
  setTimeout(() => {
    slopeEl.style.transform = "scale(1)";
  }, 100);

  // 🎰 777演出
  if (resultVal === 777) {
    slopeEl.textContent = "777 🎉";
    slopeEl.style.color = "#ffd700";
    slopeEl.style.textShadow = "0 0 10px #ffd700, 0 0 30px #ffae00";

    slopeEl.animate(
      [
        { transform: "translateX(0px)" },
        { transform: "translateX(-4px)" },
        { transform: "translateX(4px)" },
        { transform: "translateX(0px)" }
      ],
      { duration: 200, iterations: 2 }
    );
  }
}
 function showComingSoon(name) {
  alert(name + " は準備中です");
}
 function showHome() {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById("home").style.display = "grid";
}

function showTab(id, btn) {
  document.getElementById("home").style.display = "none";
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>
</body>
</html>
