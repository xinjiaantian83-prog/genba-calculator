<body style="font-family:sans-serif;padding:40px;line-height:1.8;">
<h1>プライバシーポリシー</h1>

<p>現場電卓 は、ユーザーの個人情報を収集・保存・共有しません。</p>

<p>本アプリは以下を行いません：</p>

<ul>
<li>アカウント登録</li>
<li>個人情報の収集</li>
<li>位置情報の取得</li>
<li>外部サーバーへのデータ送信</li>
<li>広告配信</li>
<li>決済処理</li>
</ul>

<p>入力データは端末内(localStorage)にのみ保存されます。</p>

<p>本ポリシーは必要に応じて更新される場合があります。</p>

</body>
</html>
